<meta name="apple-mobile-web-app-capable" content="yes">

<script>try{var d=document.documentElement,t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=t;if(t==="dark")document.querySelector('meta[name="theme-color"]').content="#0E1626";var s=localStorage.getItem("season");if(s)d.dataset.season=s}catch(e){}</script>

<link rel="modulepreload" href="config.js">
<link rel="modulepreload" href="js/core.js">

<link rel="modulepreload" href="vendor/firebase/firebase-auth.js">
</head>
<body class="admin compta">
<header class="hero">
  <button id="theme" class="icon-btn theme-btn" type="button" aria-label="Changer de thème">
  <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
  <div class="brand"><img class="app-ico" src="icons/admin-192.png" alt="" width="38" height="38"><h1>Compta</h1></div>
</header>

<main>
  <p id="boot" class="note boot">Chargement…</p>

  <form id="login" class="card login" hidden>
    <h2>Connexion</h2>
    <label for="em">E-mail</label><input id="em" type="email" required autocomplete="username">
    <label for="pw">Mot de passe</label><input id="pw" type="password" required autocomplete="current-password">
    <p class="msg" id="lerr" role="alert"></p>
    <div class="actions"><button class="btn">Se connecter</button></div>
  </form>

  <div id="panel" hidden>
    <!-- Les deux filtres s'appliquent à tout ce qui est affiché en dessous -->
    <div class="filters">
      <select id="period" aria-label="Période">
        <option value="1">Aujourd'hui</option>
        <option value="7" selected>7 derniers jours</option>
        <option value="30">30 derniers jours</option>
        <option value="0">Tout</option>
      </select>
      <select id="group" aria-label="Regrouper par">
        <option value="day">Par jour</option>
        <option value="week">Par semaine</option>
      </select>
    </div>

    <div id="report">
      <h2>Résumé</h2>
      <div class="kpis" id="kpis"></div>
      <div class="card split" id="cash"></div>

      <h2 id="byh">Ventes par jour</h2>
      <figure class="card chart" id="chart"></figure>
      <div id="byday"></div>

      <h2>Produits les plus vendus</h2>
      <div id="top"></div>
    </div>

    <h2>Dépenses</h2>
    <form id="addx" class="card xform">
      <div class="row2 even">
        <div><label for="xd">Date</label><input id="xd" type="date" required></div>
        <div><label for="xa">Montant (€)</label><input id="xa" type="number" inputmode="decimal" step="0.01" min="0" placeholder="12,50" required></div>
      </div>
      <label for="xl">Achat</label><input id="xl" type="text" maxlength="80" placeholder="Ex : cartons d'Oasis" required>
      <div class="actions"><button class="btn sm">Ajouter la dépense</button></div>
    </form>
    <div id="xlist"></div>

    <h2>Export</h2>
    <div class="chips">
      <button class="btn sm" type="button" id="ex-o">Commandes (CSV)</button>
      <button class="btn sm" type="button" id="ex-x">Dépenses (CSV)</button>
    </div>
    <p class="note">Les exports suivent la période choisie. Ils s'ouvrent dans Excel ou Google Sheets.</p>
  </div>
</main>

  <a href="admin.html#boutique" data-tab="boutique"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 9 1-5h14l1 5"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8"/><path d="M10 20v-5h4v5"/></svg><span>Boutique</span></a>
  <a href="compta.html" aria-current="page"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h20"/><path d="M6 20v-8M12 20V5M18 20v-5"/></svg><span>Compta</span></a>
</nav>

</body>
</html>
